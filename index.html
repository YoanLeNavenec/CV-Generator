<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Generator</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>

  <body class="bg-primary-subtle">
    <div class="container d-flex flex-row">
      <div class="col-5 d-flex flex-column gap-2">
        <h1>Enter your informations</h1>
            <div class="col-1">
              <h2>Contact</h2>
                  <form>
                    <label class="form-label">Your Name
                      <input type="text" name="Name" id="Name" placeholder="Pooch Hyena" class="input form-control-lg" required>
                    </label>
                    
                    <label class="form-label">Objective
                      <input type="text" name="Objective" id="Objective" placeholder="Apprentice as a Pokemon Master" class="input form-control-lg" required>
                    </label>

                    <label class="form-label">Your Email
                      <input type="text" name="Email" id="Email" placeholder="PoochHyena@Hoen.pkmn" class="input form-control-lg" required>
                    </label>

                    <label class="form-label">Your Phone Number
                      <input type="text" name="Phone" id="Phone" placeholder="0261026233" class="input form-control-lg" required>
                    </label>

                    <label class="form-label">Your Adress
                      <input type="text" name="Adress" id="Adress" placeholder="123, Pkmn Safari" class="input form-control-lg" required>
                    </label>
            </div>

            
                    <div>
                      <h3>Picture of you</h3>
                        <input type="file" name="Picture" accept="image/*">
                    </div>
                    
                    <div class="col-1" id="ExpPro"> 
                      <h3>Professional Experience</h3>
                        <div>
                            <label class="form-label">Job Name
                              <input type="text" class="form-control-lg Work" placeholder="Feral Pokemon" name="WorkName1" required>
                            </label>

                            <label class="form-label">Work Period
                              <input type="text" class="form-control-lg Work" placeholder="3th gen > 8th gen" name="WorkPeriod1" required>
                            </label>

                            <label class="form-label">Work Location
                              <input type="text" class="form-control-lg Work" placeholder="Road 6" name="WorkLocation1" required>
                            </label>
                            
                            <label class="form-label">Work Description
                              <input type="text" class="form-control-lg Work" placeholder="Feral Pokemon to practice new trainers" name="WorkDescription1" required>
                            </label>      
                        </div> 
                    </div>

                        <div>
                          <button class="btn btn-primary btn" onclick="AddJob()">Add an Experience</button> 
                        </div>

                        <div class="col-1" id="Diplos">
                          <h3>Diplomas</h3>
                                
                                <label class="form-label" for="DiploName1"> Diploma Name</label>
                                <input type="text" class="DiplomaName form-control-lg" placeholder="Stone Badge" name="DiploName1" required>

                                <label class="form-label" for="DiploYear1"> Year of Obtention</label>
                                  <input type="text" class=" DiploYear form-control-lg" placeholder="4th gen" name="DiploYear1" required>
                                
                                <label class="form-label" for="DiploName2"> Diploma Name</label>
                                  <input type="text" class="DiplomaName form-control-lg" placeholder="Knuckles Badge" name="DiploName2" required>

                                <label class="form-label" for="DiploYear2"> Year of Obtention</label>
                                  <input type="text" class=" DiploYear form-control-lg" placeholder="4th gen" name="DiploYear2" required>

                                <label class="form-label" for="DiploName3"> Diploma Name</label>
                                  <input type="text" class="DiplomaName form-control-lg" placeholder="Dynamo Badge" name="DiploName3" required>

                                <label class="form-label" for="DiploYear3"> Year of Obtention</label>
                                  <input type="text" class=" DiploYear form-control-lg" placeholder="4th gen" name="DiploYear3" required>       
                        </div>

                    <div>
                      <button type="button" class="btn btn-primary btn" onclick="AddDiploma()"> Add a Diploma</button> 
                    </div>

                    <div class="col-1" id="Skills">
                      <h3>Professional Skills</h3>
                            <input type="text" class="Skills form-control-lg" placeholder="Growl" name="Skill1" required>
                            <input type="text" class="Skills form-control-lg" placeholder="Bite" name="Skill2" required>
                            <input type="text" class="Skills form-control-lg" placeholder="Pursuit" name="Skill3" required>
                    </div>

                    <div>
                      <button type="button" class="btn btn-primary btn" onclick="AddSkill()"> Add a Skill</button> 
                    </div>

                    <div class="col-1" id="SoftSkill"> 
                      <h3>Soft Skills</h3>
                            <input type="text" class="SoftSkill form-control-lg" placeholder="Pack Work" name="SoftSkill1" required>
                            <input type="text" class="SoftSkill form-control-lg" placeholder="Street Smart" name="SoftSkill2" required>
                            <input type="text" class="SoftSkill form-control-lg" placeholder="Persistant" name="SoftSkill3" required> 
                    </div>

                    <div>
                      <button type="button" class="btn btn-primary btn" onclick="AddSoftSkill()"> Add a Soft Skill</button> 
                    </div>

                      <div>
                      <button type="submit" class="btn btn-success btn" onclick="GenResume()">Create your Resume</button>
                    </div>

                  </form> 
          </div>

          <div id="Resume" class="col-7 flex-column preview container">
            <h2>Preview your Resume</h2>
            <div class="ResumeHeader">

              <div id="Preview-Picture" class="picture"></div>

              <div id="Preview-Name"></div>

              <div id="Preview-Objective"></div>

              <div>
                <div id="Preview-Phone"></div>
                <div id="Preview-Email"></div>
                <div id="Preview-Adress"></div>
              </div>

            </div>

            <div class="box">
              <h2>Experience</h2>
              <div id="PreviewWork"></div>
            </div>

            <div class="box">
              <h3>Diplomas</h3>
              <div id="PreviewDiplomas"></div>
            </div>

            <div class="box">
              <h3>Skills</h3>
              <div id="PreviewSkills"></div>
            </div>

            <div class="box">
              <h3>Soft Skills</h3>
              <div id="PreviewSoftSkills"></div>
            </div>

        </div>
      </div>

      <script src="Form.js"></script>
      <script src="preview.js"></script>
      
  </body>
</html>
